[project]
name = "lowrank"
version = "0.1.0"
description = "Reproducing low-rank recurrent network dynamics and computations"
readme = "README.md"
authors = [{ name = "Simon Walker", email = "simon@simonwalker.tech" }]
requires-python = ">=3.13"
dependencies = [
  "einx>=0.4.3",
  "equinox>=0.13.8",
  "jax>=0.12.0.1",
  "jaxtyping>=0.3.11",
  "matplotlib>=3.11.2",
  "numpy>=2.5.4",
  "pytest>=9.1.1",
  "scipy>=1.18.1",
  "snakemake>=9.0",
  "pyyaml>=6.0",
]

[project.scripts]
lowrank = "lowrank:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["basedpyright>=1.40.2"]

[tool.basedpyright]
typeCheckingMode = "basic"
